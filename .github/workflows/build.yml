# Builds unsigned release APK and AAB. Download them from the run's "Artifacts" and sign locally.
name: Build unsigned release

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore: ["**.md", "fastlane/**", ".github/ISSUE_TEMPLATE/**"]

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      NAME: SparkleDNS
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4

      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon clean assembleRelease bundleRelease

      - name: Collect files
        run: |
          ver=$(grep -oP 'versionName = "\K[^"]+' app/build.gradle.kts)
          mkdir out
          cp app/build/outputs/apk/release/app-release-unsigned.apk "out/$NAME-v$ver-unsigned.apk"
          cp app/build/outputs/bundle/release/app-release.aab "out/$NAME-v$ver-unsigned.aab"
          cp app/build/outputs/mapping/release/mapping.txt "out/$NAME-v$ver-mapping.txt"
          git log -1 --format="Commit %h, %ci: %s" > out/BUILD-INFO.txt
          echo "VER=$ver" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.NAME }}-v${{ env.VER }}-unsigned
          path: out/
          retention-days: 30
